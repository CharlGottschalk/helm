<!doctype html>
<html>
<head><meta charset="utf-8" /></head>
<body>
  <div class="h-stack">
    <div class="h-row">
      <button id="rename" class="h-btn h-btn--primary" type="button">Rename row 2</button>
      <span id="result" class="h-muted" aria-live="polite"></span>
    </div>
    <div id="app" class="h-state h-state--loading" aria-live="polite">Loading…</div>
  </div>
  <script>
    // Rows come back as arrays in column order; render them as text, never as HTML.
    const app = document.getElementById('app')
    const result = document.getElementById('result')
    const el = (tag, cls, ...kids) => { const n = document.createElement(tag); if (cls) n.className = cls; n.append(...kids.map((k) => (k instanceof Node ? k : String(k)))); return n }
    let engine = 'sqlite'

    async function load() {
      const r = await helm.call(engine, 'items', { minId: 1 })
      if (!r.ok) return (app.className = 'h-state', app.replaceChildren(el('span', '', r.error.code + ': ' + r.error.message)))
      app.className = ''
      app.replaceChildren(el('table', 'h-table',
        el('thead', '', el('tr', '', ...r.data.columns.map((c) => el('th', '', c)))),
        el('tbody', '', ...r.data.rows.map((row) => el('tr', '', ...row.map((v) => el('td', '', v === null ? '∅' : v)))))))
    }
    document.getElementById('rename').addEventListener('click', async () => {
      result.textContent = 'Waiting for confirmation…'
      const w = await helm.call(engine, 'rename', { name: 'renamed ' + new Date().toISOString().slice(11, 19), id: 2 })
      result.textContent = w.ok ? w.data.rowsAffected + ' row(s) affected' : w.error.code + ': ' + w.error.message
      load()
    })
    helm.on('settings', (s) => { engine = (s && s.engine) || 'sqlite'; load() })
    helm.ready()
  </script>
</body>
</html>
