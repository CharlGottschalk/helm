<!doctype html>
<html>
<head><meta charset="utf-8" /></head>
<body>
  <div id="app" class="h-state h-state--loading" aria-live="polite">Loading…</div>
  <script>
    // Results are untrusted data: render as text only.
    const app = document.getElementById('app')
    const line = (label, r) => { const p = document.createElement('p'); p.textContent = label + ': ' + (r.ok ? JSON.stringify(r.data) : r.error.code + ' ' + r.error.message); return p }
    async function load() {
      const item = await helm.call('svc', 'item', { id: 'a b', limit: 2 })
      const gql = await helm.call('svc', 'graphql', { n: 3 })
      const undeclared = await helm.call('svc', 'secret', {})
      const echo = await helm.call('tools', 'echo', { text: 'hi' })
      const hidden = await helm.call('tools', 'hidden', {})
      app.className = ''
      app.replaceChildren(line('item', item), line('graphql', gql), line('undeclared', undeclared), line('echo', echo), line('hidden', hidden))
    }
    load()
    helm.ready()
  </script>
</body>
</html>
